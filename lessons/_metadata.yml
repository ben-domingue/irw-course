# Settings for every lesson page. They sit here rather than in _quarto.yml so they
# travel with lessons/ when it moves into irw_site/course/.
engine: knitr
filters:
  - webr
# Lesson code readers can download (and the in-browser setup, webr/build_repo.R).
resources:
  - code/*.R
# Empirical sections fetch IRW data and fit models at render time; freeze keeps
# those results until the lesson's source changes.
freeze: auto
format:
  html:
    # Both fix quarto-webr problems on pages with OJS widgets (#13): the first
    # stops Observable's module loader from capturing the code editor's modules;
    # the second replays a Run click that lands before the editor exists.
    include-in-header: widgets/amd-dispatch.html
    include-after-body: widgets/webr-run-guard.html
execute:
  echo: false
