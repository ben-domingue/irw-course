# Standalone preview of the course. Formatting is copied from irw_site/_quarto.yml
# (and scss/ + resources/scss/ are copies of the site's) so that lessons/ and
# index.qmd can later move into irw_site/course/ and pick up the site's own
# config unchanged. Keep course-specific settings out of this file: they belong
# in lessons/_metadata.yml and lessons.yml, which travel with the lessons.
project:
  type: website
  render:
    - index.qmd
    - lessons/*.qmd
  # Draft hosting (ben-domingue.github.io/irw-course): reachable by URL, kept out
  # of search. Remove robots.txt, the noindex header and the announcement when the
  # course moves into irw_site.
  resources:
    - robots.txt
  preview:
    port: 4201

website:
  title: "Psychometrics with the IRW"
  site-url: https://ben-domingue.github.io/irw-course
  announcement:
    content: "**Draft.** This course is a work in progress: lessons are incomplete and will change. Comments welcome."
    type: warning
    dismissable: false
    position: below-navbar
  navbar:
    search: true
    left:
      - href: index.qmd
        text: Course map
      - href: https://itemresponsewarehouse.org
        text: Item Response Warehouse

format:
  html:
    theme:
      - cosmo
      - scss/global.scss
      - resources/scss/main.scss
    toc: false
    grid:
      sidebar-width: 0px
      body-width: 1200px
      margin-width: 0px
    callout-icon: false
    df-print: kable
    code-fold: true
    include-in-header:
      text: '<meta name="robots" content="noindex, nofollow">'

execute:
  # Results are rendered locally and committed in _freeze/, so the deploy runner
  # never refits a model or refetches data.
  freeze: auto
  echo: false
  message: false
  warning: false
  error: false
