# The one source of truth for the course map. Each lesson is a stand-alone page at
# lessons/<id>.qmd. The map (index.qmd), each lesson's header box, and the
# prerequisite check all read this file, so edit a lesson's metadata here and
# nowhere else.
#
# Fields:
#   id        slug; also the file name lessons/<id>.qmd
#   title     page title
#   module    one of the ids under `modules`
#   prereqs   lesson ids a reader should have seen first (the map's arrows)
#   origin    where the material comes from in EDUC 252: slide deck (c1..c10),
#             problem set items (PS1#4), and scripts in ben-domingue/252
#   tables    IRW tables the lesson uses; each is cited in the lesson's generated
#             Data sources block (run check_tables.R after adding one)
#   reuses    tables in `tables` that an earlier lesson already uses, returned to
#             deliberately (a thread). check_tables.R flags any other reuse.
#   status    stub | draft | done
#   tranche   preliminary | core | extension (Ben, 09-24). Preliminary lessons set
#             up the course; core lessons make a first course; extensions go
#             further. A lesson may not list a prerequisite from a later tranche.
#             Draft in tranche order.
#
# Threads (the `threads:` list at the end) record ideas introduced in one lesson
# and returned to in later ones (PROTOCOL.md §4). Each has
#   id          slug
#   idea        short phrase, shown in the header box of every lesson it touches
#   introduced  lesson id
#   returns     list of {lesson, how}: `how` says in a clause what the later
#               lesson does with the idea (tests it, relaxes it, shows it failing)
# check_course() fails on an unknown lesson, a missing field, or a return to the
# introducing lesson or one of its prerequisites.
#
# 2026-09-24: six lessons added and core/optional set after the landscape
# analysis in notes/landscape-2026-09-24.md.
# DRAFT 2026-09-24: lesson boundaries and prerequisites are a first cut for Ben to
# revise. c7.pptx is missing from the Drive export, so the CDM lesson's slide
# origin is a guess.

