# The one source of truth for the course map. Each lesson is a stand-alone page at
# lessons/<id>.qmd. The map (index.qmd), each lesson's header box, and the
# prerequisite check all read this file, so edit a lesson's metadata here and
# nowhere else.
#
# Fields:
#   id        slug; also the file name lessons/<id>.qmd
#   title     page title
#   module    one of the ids under `modules`
#   prereqs   lesson ids a reader should have seen first (the map's arrows)
#   origin    where the material comes from in EDUC 252: slide deck (c1..c10),
#             problem set items (PS1#4), and scripts in ben-domingue/252
#   tables    IRW tables the lesson uses
#   status    stub | draft | done
#   optional  true for lessons beyond a first course (default: core). A core
#             lesson may not list an optional one as a prerequisite.
#
# 2026-09-24: six lessons added and core/optional set after the landscape
# analysis in notes/landscape-2026-09-24.md.
# DRAFT 2026-09-24: lesson boundaries and prerequisites are a first cut for Ben to
# revise. c7.pptx is missing from the Drive export, so the CDM lesson's slide
# origin is a guess.

