# Paths are orderings through the map. Anyone teaching from this can add their own.
paths:
  - id: first-course
    title: "A first course (preliminary and core lessons)"
    lessons: [measurement, irw-data, likelihood, constructs, ctt-reliability, instrument-building,
              g-theory, ctt-limits, validity-argument, validity-evidence, fa-exploratory, rasch,
              1pl-to-4pl, information, ability-estimation, fa-confirmatory, fit-prediction,
              polytomous, fairness, dif, score-meaning, equating]

  - id: educ252
    title: "EDUC 252 (Stanford), a 10-week course"
    # The order of the 252 classes, adjusted only where a lesson would otherwise come
    # before its prerequisite (1pl-to-4pl before information; item-banks-cat after
    # polytomous).
    lessons: [measurement, irw-data, likelihood, constructs, ctt-reliability, ctt-limits,
              validity-argument, rasch, 1pl-to-4pl, information, ability-estimation, validity-causal,
              parameter-invariance, dimensionality, fairness, dif, item-estimation,
              fit-prediction, guessing-priors, equating, invariance-experience,
              explanatory-irt, cdm, polytomous, item-banks-cat, irtrees, unfolding, nominal, response-time,
              trials, ai-psychometrics]

# Filled in by the cross-check passes over the outlines (#9). Example:
#   - id: specific-objectivity
#     idea: Specific objectivity
#     introduced: rasch
#     returns:
#       - {lesson: 1pl-to-4pl, how: crossing ICCs in the chess data break it}
threads:
  # Pass 1 (09-24): proposed by the retrofits of ctt-reliability, fa-exploratory and
  # rasch (#110-#112); every return is a descendant of the introducing lesson (E2).
  - id: alpha-lower-bound
    idea: Alpha is a lower bound on reliability
    introduced: ctt-reliability
    returns:
      - {lesson: ctt-limits, how: shows how loose the bound can be (ctt_failures)}
      - {lesson: fa-exploratory, how: reads tau-equivalence as equal loadings}
      - {lesson: fa-confirmatory, how: replaces alpha with omega}
      - {lesson: dimensionality, how: shows correlated errors and testlets breaking the bound}
  - id: one-sem
    idea: One standard error of measurement for everyone
    introduced: ctt-reliability
    returns:
      - {lesson: information, how: replaces it with a conditional SEM that varies with θ}
      - {lesson: score-meaning, how: turns it into error bands around reported scores}
  - id: reverse-keying
    idea: Keying has to be checked; the data can't always tell
    introduced: ctt-reliability
    returns:
      - {lesson: instrument-building, how: writes reversed items on purpose}
      - {lesson: fa-exploratory, how: checks the BFI-2's keying rather than assuming it}
      - {lesson: polytomous, how: reverses rating-scale categories before fitting}
      - {lesson: irtrees, how: keys the data before the tree is built}
      - {lesson: unfolding, how: shows items that are neither forward nor reversed}
  - id: attenuation
    idea: Unreliability attenuates correlations
    introduced: ctt-reliability
    returns:
      - {lesson: validity-evidence, how: corrects validity coefficients for it}
      - {lesson: sem, how: removes it by modelling the latent variables}
      - {lesson: fairness, how: shows unreliability producing intercept differences between groups}
  - id: unidimensionality
    idea: One factor accounts for the item correlations
    introduced: fa-exploratory
    returns:
      - {lesson: fa-confirmatory, how: tests one factor against the designed facets}
      - {lesson: dimensionality, how: fits multidimensional IRT and asks how often one dimension holds}
  - id: rotation-indeterminacy
    idea: The data fix the correlations, not the frame of the factors
    introduced: fa-exploratory
    returns:
      - {lesson: fa-confirmatory, how: identifies the model by fixing loadings}
      - {lesson: dimensionality, how: rotates the axes of a multidimensional IRT model}
  - id: chess-y15
    idea: "Chess item Y15: Elo barely predicts it"
    introduced: likelihood
    returns:
      - {lesson: rasch, how: finds it among the worst-fitting items (largest outfit by default)}
      - {lesson: 1pl-to-4pl, how: gives it a slope near zero in the 2PL}
  - id: sum-score-sufficiency
    idea: The sum score is sufficient under the Rasch model
    introduced: rasch
    returns:
      - {lesson: 1pl-to-4pl, how: shows the 2PL weighting items by slope instead}
      - {lesson: ability-estimation, how: shows θ̂ depends on the responses only through r}
      - {lesson: polytomous, how: keeps it in the partial credit model}
      - {lesson: dif, how: makes the Mantel-Haenszel null exact when matching on the total}
      - {lesson: cdm, how: contrasts attribute counts with sum scores}
      - {lesson: scale-properties, how: asks what it licenses about the scale}
  - id: specific-objectivity
    idea: Item comparisons don't depend on who took the items
    introduced: rasch
    returns:
      - {lesson: 1pl-to-4pl, how: shows it failing when ICCs cross (Y15)}
      - {lesson: parameter-invariance, how: tests it across samples}
      - {lesson: scale-properties, how: asks what it buys for an equal-interval scale}
  - id: no-origin
    idea: Only θ − b is identified; the scale has no origin
    introduced: rasch
    returns:
      - {lesson: equating, how: links scales that differ by a shift (and a stretch)}
      - {lesson: scale-properties, how: separates convention from measurement}
  - id: conditional-ml
    idea: Conditioning on the sum score removes θ
    introduced: rasch
    returns:
      - {lesson: item-estimation, how: compares conditional, joint and marginal ML}
      - {lesson: fit-prediction, how: uses Andersen's likelihood-ratio test}
  - id: overfit-underfit
    idea: Misfit as overfit or underfit (outfit and infit)
    introduced: rasch
    returns:
      - {lesson: fit-prediction, how: gives outfit its null distribution}
      - {lesson: item-banks-cat, how: screens bank items with it}
      - {lesson: scale-properties, how: asks how much misfit a scale can bear}
  - id: local-independence
    idea: Responses are independent given θ
    introduced: rasch
    returns:
      - {lesson: dimensionality, how: shows passages and testlets breaking it}
      - {lesson: explanatory-irt, how: models the dependence with random effects}
      - {lesson: unfolding, how: keeps it but drops the monotone curve the Rasch model pairs with it}

  # Pass 2 (09-24 night): proposed by the wave-0 drafts (#123-#126); returns kept only
  # where they are descendants of the introducing lesson (E2).
  - id: sum-score-part-whole
    idea: "The sum score contains the item"
    introduced: ctt-limits
    returns:
      - {lesson: rasch, how: shows r = 0 and r = max agreeing by construction (wirs)}
  - id: items-rise-with-score
    idea: "Item curves rise with the sum score (monotonicity)"
    introduced: ctt-limits
    returns:
      - {lesson: rasch, how: models them as ICCs}
      - {lesson: unfolding, how: finds single-peaked curves (andrich_mudfold)}
  - id: sum-score-depends-on-items
    idea: "The sum score depends on which items were taken"
    introduced: ctt-limits
    returns:
      - {lesson: rasch, how: puts people and items on one scale instead}
      - {lesson: equating, how: links scores across forms}
  - id: equal-unit
    idea: "Whether a scale has an equal unit changes group comparisons"
    introduced: measurement
    returns:
      - {lesson: score-meaning, how: percentile ranks need only order}
      - {lesson: equating, how: links on θ}
      - {lesson: scale-properties, how: asks what the Rasch model licenses}
  - id: dominance
    idea: "A mean difference keeps its sign under every rescaling only under stochastic dominance"
    introduced: measurement
    returns:
      - {lesson: scale-properties, how: applies it to gains}
      - {lesson: dif, how: compares groups on θ}
  - id: desiderata
    idea: "What we want from a measure: insensitive to nonfocal attributes, calibrated, precise quickly"
    introduced: measurement
    returns:
      - {lesson: dif, how: tests insensitivity}
      - {lesson: validity-argument, how: argues for it}
      - {lesson: information, how: measures precision}
      - {lesson: item-banks-cat, how: delivers it quickly}
      - {lesson: fairness, how: tests insensitivity for a whole scale}
  - id: probes
    idea: "Constructs are measured through probes"
    introduced: measurement
    returns:
      - {lesson: constructs, how: builds a construct map}
      - {lesson: instrument-building, how: writes the probes}
  - id: measurement-discovery
    idea: "Measurement as discovery; is the attribute quantitative?"
    introduced: measurement
    returns:
      - {lesson: constructs, how: asks what the construct is}
      - {lesson: validity-causal, how: asks whether the attribute exists}
  - id: long-format
    idea: "IRW tables are long: one row per response"
    introduced: irw-data
    returns:
      - {lesson: likelihood, how: fits a logistic regression to one row per response}
      - {lesson: ctt-reliability, how: reshapes to wide for item analysis}
  - id: keying-check
    idea: "Check keying in the documentation and in the data"
    introduced: irw-data
    returns:
      - {lesson: ctt-reliability, how: meets the unkeyed Mach IV}
  - id: slow-errors
    idea: "Errors are slower than correct responses, partly because of where errors happen"
    introduced: irw-data
    returns:
      - {lesson: rt-process-models, how: models slow errors}
      - {lesson: trials, how: treats conditions as items}
  - id: lower-asymptote-identification
    idea: "The data say little about c when few respondents sit near chance"
    introduced: 1pl-to-4pl
    returns:
      - {lesson: guessing-priors, how: fixes c or puts a prior on it}
      - {lesson: nominal, how: looks at the distractors}
      - {lesson: fit-prediction, how: compares the 2PL and 3PL out of sample}
  - id: weighted-score
    idea: "Under the 2PL the weighted score is sufficient"
    introduced: 1pl-to-4pl
    returns:
      - {lesson: ability-estimation, how: estimates θ from it}
      - {lesson: information, how: weights items by slope}

